services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nimbusbill
      POSTGRES_USER: nimbusbill
      POSTGRES_PASSWORD: nimbusbill
    ports:
      - "5432:5432"
    volumes:
      - nimbusbill_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbusbill -d nimbusbill"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend/customer-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nimbusbill
      DB_USERNAME: nimbusbill
      DB_PASSWORD: nimbusbill
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      SECURITY_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: ../NimbusBill-Customer-Portal-React/nimbusbill-ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  nimbusbill_pgdata:
